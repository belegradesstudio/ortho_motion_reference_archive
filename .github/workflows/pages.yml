name: Deploy archive site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate catalog
        run: node scripts/validate-catalog.mjs

      - name: Build static site
        shell: bash
        run: |
          mkdir -p _site/data _site/clips
          cp -R site/. _site/
          cp catalog/clips.json _site/data/clips.json
          if compgen -G "public/clips/*" > /dev/null; then
            cp -R public/clips/. _site/clips/
          fi
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
